name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      - name: unit tests (offline)
        run: |
          npx tsx src/router.test.ts
          npx tsx src/config.test.ts
          npx tsx src/credentials.test.ts
          npx tsx src/jev.test.ts
          node --experimental-strip-types src/index.test.ts

      - name: dry-run scripts (no model calls)
        run: |
          npx tsx scripts/eval.ts
          npx tsx scripts/ab.ts
